[project]
name = "finalproject-lukyanovich-m26-555"
version = "0.1.0"
description = "Учебный симулятор торговли валютами ValutaTrade Hub"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
data_dir = "data"
logs_dir = "logs"
rates_ttl_seconds = 60
default_base_currency = "USD"
log_format = "text"

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"
